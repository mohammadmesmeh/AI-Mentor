<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الملف الشخصي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&amp;family=Zain:wght@700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1120px; box-sizing: border-box; display: flex; background-color: #EDF2F9; background-image: radial-gradient(560px 440px at 88% 6%, rgba(70,131,203,0.26), transparent 70%), radial-gradient(640px 520px at 10% 58%, rgba(18,49,77,0.14), transparent 70%), radial-gradient(480px 380px at 62% 100%, rgba(29,78,137,0.14), transparent 70%); color: #12314D; font-family: 'Noto Sans Arabic', system-ui, sans-serif; line-height: 1.7; overflow: hidden">

<div style="width: 264px; flex-shrink: 0">
<dc-import name="Sidebar" active="profile" hint-size="264px,1120px"></dc-import>
</div>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.75)">
<div style="font-size: 13px; color: #667085">الحساب / <span style="color: #0A1930; font-weight: 600">الملف الشخصي</span></div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">English</button>
<button type="button" aria-label="تبديل السمة" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>
</button>
</div>
</header>

<main style="flex-grow: 1; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px; max-width: 980px">

<h1 style="margin: 0; font-family: 'Zain', 'Noto Sans Arabic', sans-serif; font-size: 34px; font-weight: 800; color: #0A1930; line-height: 1.4">الملف الشخصي</h1>

<section aria-label="الحساب" style="background: rgba(255,255,255,0.58); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; box-shadow: 0 10px 30px rgba(18,49,77,0.07), inset 0 1px 0 rgba(255,255,255,0.9); padding: 28px; display: flex; align-items: center; gap: 20px">
<div style="width: 76px; height: 76px; border-radius: 999px; background: #12314D; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Zain', 'Noto Sans Arabic', sans-serif; font-size: 32px; font-weight: 800; flex-shrink: 0">م</div>
<div style="flex-grow: 1">
<div style="font-family: 'Zain', 'Noto Sans Arabic', sans-serif; font-size: 26px; font-weight: 800; color: #0A1930; line-height: 1.4">محمد</div>
<div style="font-size: 14px; color: #667085">[البريد الإلكتروني للمستخدم]</div>
<span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: #1D4E89">الخطة المجانية</span>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
<span>تعديل الاسم</span>
</button>
</section>

<section aria-labelledby="lp" style="background: rgba(255,255,255,0.58); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; box-shadow: 0 10px 30px rgba(18,49,77,0.07), inset 0 1px 0 rgba(255,255,255,0.9); padding: 28px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
<h2 id="lp" style="margin: 0; font-size: 17px; font-weight: 600; color: #0A1930">ملفك التعليمي</h2>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">تعديل</button>
</div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid rgba(18,49,77,0.08); font-size: 14px">
<span style="color: #667085">{{r.label}}</span>
<span style="font-weight: 600; color: #0A1930">{{r.value}}</span>
</div>
</sc-for>
<div style="display: flex; align-items: flex-start; gap: 10px; margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: rgba(222,234,251,0.6); color: #1D4E89; font-size: 13px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
<span>تغيير الهدف أو المجال يعيد بناء خطتك من جديد، ويبدأ تقدّمك من الصفر.</span>
</div>
</section>

</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ label: 'الهدف', value: 'هندسة الواجهات الأمامية' },
{ label: 'المجال', value: 'البرمجة' },
{ label: 'المستوى', value: 'متوسط' },
{ label: 'الوقت اليومي', value: '45 دقيقة' },
{ label: 'النتيجة المطلوبة', value: 'الحصول على وظيفة مطوّر واجهات' },
{ label: 'لغة المصادر', value: 'العربية والإنجليزية' }
]
};
}
}
</script>
</body>
</html>
