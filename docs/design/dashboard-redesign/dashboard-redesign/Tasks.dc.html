<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المهام</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&amp;family=Zain:wght@700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1120px; box-sizing: border-box; display: flex; background-color: #EDF2F9; background-image: radial-gradient(560px 440px at 88% 6%, rgba(70,131,203,0.26), transparent 70%), radial-gradient(640px 520px at 10% 58%, rgba(18,49,77,0.14), transparent 70%), radial-gradient(480px 380px at 62% 100%, rgba(29,78,137,0.14), transparent 70%); color: #12314D; font-family: 'Noto Sans Arabic', system-ui, sans-serif; line-height: 1.7; overflow: hidden">

<div style="width: 264px; flex-shrink: 0">
<dc-import name="Sidebar" active="tasks" hint-size="264px,1120px"></dc-import>
</div>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.75)">
<div style="font-size: 13px; color: #667085">التعلّم / <span style="color: #0A1930; font-weight: 600">المهام</span></div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">English</button>
<button type="button" aria-label="تبديل السمة" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>
</button>
</div>
</header>

<main style="flex-grow: 1; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px">

<section style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Zain', 'Noto Sans Arabic', sans-serif; font-size: 34px; font-weight: 800; color: #0A1930; line-height: 1.4">المهام</h1>
<p style="margin: 0; font-size: 14px; color: #667085">كل مهام خطتك مرتّبة حسب المراحل. أكمل المهمة المتاحة لتنفتح التالية.</p>
</section>

<div role="tablist" aria-label="تصفية حسب الحالة" style="display: inline-flex; align-self: flex-start; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(18,49,77,0.07)">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{f.sel}}" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 0; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; {{f.style}}">
<span>{{f.label}}</span>
<span style="font-size: 13px; {{f.countStyle}}">{{f.count}}</span>
</button>
</sc-for>
</div>

<section style="background: rgba(255,255,255,0.58); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; box-shadow: 0 10px 30px rgba(18,49,77,0.07), inset 0 1px 0 rgba(255,255,255,0.9); overflow: hidden">
<div style="display: grid; grid-template-columns: 44px minmax(0, 2.6fr) minmax(0, 1.3fr) 130px 90px 120px 90px; align-items: center; gap: 12px; padding: 12px 20px; background: rgba(255,255,255,0.35); border-bottom: 1px solid rgba(18,49,77,0.08); font-size: 12px; font-weight: 700; color: #475467">
<span></span><span>المهمة</span><span>المرحلة</span><span>النوع</span><span>الوقت</span><span>الحالة</span><span></span>
</div>
<sc-for list="{{ tasks }}" as="t" hint-placeholder-count="9">
<div style="display: grid; grid-template-columns: 44px minmax(0, 2.6fr) minmax(0, 1.3fr) 130px 90px 120px 90px; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid rgba(18,49,77,0.08); {{t.row}}">
<div style="width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; {{t.mark}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
</div>
<span style="font-size: 14px; font-weight: 600; color: {{t.color}}">{{t.title}}</span>
<span style="font-size: 13px; color: #475467">{{t.stage}}</span>
<span style="font-size: 13px; color: #475467">{{t.type}}</span>
<span style="font-size: 13px; color: #475467">{{t.time}}</span>
<span style="justify-self: start; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; {{t.pill}}"><span style="width: 7px; height: 7px; border-radius: 999px; background: currentColor; flex-shrink: 0"></span>{{t.state}}</span>
<a href="#" style="justify-self: end; font-size: 13px; font-weight: 600; color: #1D4E89; text-decoration: none">عرض</a>
</div>
</sc-for>
</section>

</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
const S = {
done: { state: 'مكتملة', icon: 'M20 6 9 17l-5-5', mark: 'background: #12314D; color: #ffffff', pill: 'color: #12314D', color: '#475467', row: '' },
avail: { state: 'متاحة', icon: 'M8 5l11 7-11 7z', mark: 'background: #ffffff; color: #7C3AED; border: 2px solid #7C3AED', pill: 'color: #6D28D9', color: '#0A1930', row: 'background: #FBFAFF' },
locked: { state: 'مقفلة', icon: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4', mark: 'background: #F1F5F9; color: #667085', pill: 'color: #475467', color: '#344054', row: '' },
up: { state: 'قادمة', icon: 'M12 12h.01', mark: 'background: #ffffff; color: #98A2B3; border: 2px solid #D0D5DD', pill: 'color: #1D4E89', color: '#344054', row: '' }
};
const t = (title, stage, type, time, k) => Object.assign({ title, stage, type, time }, S[k]);
const f = (label, count, sel) => ({ label, count, sel: sel ? 'true' : 'false',
style: sel ? 'background: #ffffff; color: #0A1930; box-shadow: 0 1px 2px rgba(18,49,77,0.12)' : 'background: transparent; color: #475467',
countStyle: sel ? 'color: #667085' : 'color: #98A2B3' });
return {
filters: [f('الكل', '9', true), f('متاحة', '1'), f('مكتملة', '4'), f('مقفلة', '1'), f('قادمة', '3')],
tasks: [
t('مقدمة إلى ‏HTML‏ الدلالي', 'أساسيات الويب', 'قراءة', '20 د', 'done'),
t('تنسيق الصفحات باستخدام ‏Flexbox‏', 'أساسيات الويب', 'فيديو', '25 د', 'done'),
t('أساسيات ‏JavaScript‏ الحديثة', 'أساسيات الويب', 'تحدٍّ برمجي', '35 د', 'done'),
t('مفهوم المكوّنات و‏JSX‏', 'أساسيات ‏React‏', 'قراءة', '20 د', 'done'),
t('بناء مكوّنات قابلة لإعادة الاستخدام', 'أساسيات ‏React‏', 'مشروع', '40 د', 'avail'),
t('إدارة الحالة باستخدام ‏useState‏', 'أساسيات ‏React‏', 'تحدٍّ برمجي', '30 د', 'locked'),
t('تخطيط المشروع التطبيقي', 'مشروع تطبيقي', 'مهمة', '25 د', 'up'),
t('بناء واجهة المشروع', 'مشروع تطبيقي', 'مشروع', '50 د', 'up'),
t('مراجعة المشروع ونشره', 'مشروع تطبيقي', 'مهمة', '30 د', 'up')
]
};
}
}
</script>
</body>
</html>
