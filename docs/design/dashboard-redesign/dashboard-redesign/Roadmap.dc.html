<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الخطة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&amp;family=Zain:wght@700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1120px; box-sizing: border-box; display: flex; background-color: #EDF2F9; background-image: radial-gradient(560px 440px at 88% 6%, rgba(70,131,203,0.26), transparent 70%), radial-gradient(640px 520px at 10% 58%, rgba(18,49,77,0.14), transparent 70%), radial-gradient(480px 380px at 62% 100%, rgba(29,78,137,0.14), transparent 70%); color: #12314D; font-family: 'Noto Sans Arabic', system-ui, sans-serif; line-height: 1.7; overflow: hidden">

<div style="width: 264px; flex-shrink: 0">
<dc-import name="Sidebar" active="roadmap" hint-size="264px,1120px"></dc-import>
</div>

<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.75)">
<div style="font-size: 13px; color: #667085">التعلّم / <span style="color: #0A1930; font-weight: 600">الخطة</span></div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">English</button>
<button type="button" aria-label="تبديل السمة" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.7); color: #12314D; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>
</button>
</div>
</header>

<main style="flex-grow: 1; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 24px">

<section style="background: rgba(255,255,255,0.58); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,0.8); border-radius: 16px; box-shadow: 0 10px 30px rgba(18,49,77,0.07), inset 0 1px 0 rgba(255,255,255,0.9); padding: 24px; display: flex; align-items: center; gap: 32px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Zain', 'Noto Sans Arabic', sans-serif; font-size: 34px; font-weight: 800; color: #0A1930; line-height: 1.4">خطتك التعليمية</h1>
<p style="margin: 0; font-size: 14px; color: #667085">هندسة الواجهات الأمامية · 3 مراحل · 9 مهام</p>
</div>
<div style="width: 340px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 14px">
<span style="font-weight: 600; color: #0A1930">4 من 9 مهام مكتملة</span>
<span style="font-weight: 700; color: #0A1930">44%</span>
</div>
<div role="progressbar" aria-label="التقدم الكلي" aria-valuenow="44" aria-valuemin="0" aria-valuemax="100" style="height: 10px; border-radius: 999px; background: #DEEAFB; overflow: hidden">
<div style="width: 44%; height: 10px; border-radius: 999px; background: #12314D"></div>
</div>
</div>
</section>

<sc-for list="{{ stages }}" as="st" hint-placeholder-count="3">
<section style="background: rgba(255,255,255,0.58); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border-radius: 16px; box-shadow: 0 10px 30px rgba(18,49,77,0.07), inset 0 1px 0 rgba(255,255,255,0.9); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; {{st.border}}">
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0; {{st.numStyle}}">{{st.num}}</div>
<div style="flex-grow: 1">
<h2 style="margin: 0; font-size: 17px; font-weight: 600; color: #0A1930; line-height: 1.4">{{st.title}}</h2>
<div style="font-size: 13px; color: #667085">{{st.count}}</div>
</div>
<div style="width: 180px; height: 8px; border-radius: 999px; background: rgba(18,49,77,0.08); overflow: hidden">
<div style="height: 8px; border-radius: 999px; width: {{st.pct}}%; background: {{st.bar}}"></div>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; {{st.pill}}"><span style="width: 7px; height: 7px; border-radius: 999px; background: currentColor; flex-shrink: 0"></span>{{st.state}}</span>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{ st.tasks }}" as="t" hint-placeholder-count="3">
<a href="#" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; text-decoration: none; {{t.row}}">
<div style="width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; {{t.mark}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
</div>
<span style="flex-grow: 1; font-size: 14px; font-weight: 600; color: {{t.color}}">{{t.title}}</span>
<span style="font-size: 13px; color: #667085">{{t.meta}}</span>
</a>
</sc-for>
</div>
</section>
</sc-for>

</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
const check = 'M20 6 9 17l-5-5';
const lock = 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4';
const play = 'M8 5l11 7-11 7z';
const dot = 'M12 12h.01';
const done = (title, meta) => ({ title, meta, icon: check, mark: 'background: #12314D; color: #ffffff', color: '#475467', row: '' });
const cur = (title, meta) => ({ title, meta, icon: play, mark: 'background: #ffffff; color: #7C3AED; border: 2px solid #7C3AED', color: '#0A1930', row: 'background: #F5F3FF' });
const locked = (title, meta) => ({ title, meta, icon: lock, mark: 'background: #F1F5F9; color: #667085', color: '#344054', row: '' });
const up = (title, meta) => ({ title, meta, icon: dot, mark: 'background: #ffffff; color: #98A2B3; border: 2px solid #D0D5DD', color: '#344054', row: '' });
return {
stages: [
{ num: '1', title: 'أساسيات الويب', count: '3 من 3 مهام', pct: 100, bar: '#12314D', state: 'مكتملة', pill: 'color: #12314D', numStyle: 'background: #EAF1FB; color: #12314D', border: 'border: 1px solid rgba(18,49,77,0.1)',
tasks: [done('مقدمة إلى ‏HTML‏ الدلالي', 'قراءة · 20 د'), done('تنسيق الصفحات باستخدام ‏Flexbox‏', 'فيديو · 25 د'), done('أساسيات ‏JavaScript‏ الحديثة', 'تحدٍّ برمجي · 35 د')] },
{ num: '2', title: 'أساسيات ‏React‏', count: '1 من 3 مهام', pct: 33, bar: '#7C3AED', state: 'قيد التنفيذ', pill: 'color: #6D28D9', numStyle: 'background: #7C3AED; color: #ffffff', border: 'border: 2px solid #7C3AED',
tasks: [done('مفهوم المكوّنات و‏JSX‏', 'قراءة · 20 د'), cur('بناء مكوّنات قابلة لإعادة الاستخدام', 'مشروع · 40 د'), locked('إدارة الحالة باستخدام ‏useState‏', 'تحدٍّ برمجي · 30 د')] },
{ num: '3', title: 'مشروع تطبيقي', count: '0 من 3 مهام', pct: 0, bar: '#12314D', state: 'قادمة', pill: 'color: #475467', numStyle: 'background: #F1F5F9; color: #475467', border: 'border: 1px solid rgba(18,49,77,0.1)',
tasks: [up('تخطيط المشروع التطبيقي', 'مهمة · 25 د'), up('بناء واجهة المشروع', 'مشروع · 50 د'), up('مراجعة المشروع ونشره', 'مهمة · 30 د')] }
]
};
}
}
</script>
</body>
</html>
