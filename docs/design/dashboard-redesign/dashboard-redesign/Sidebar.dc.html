<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&amp;family=Zain:wght@700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 264px; height: 1120px; box-sizing: border-box; background: rgba(255,255,255,0.6); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-inline-end: 1px solid rgba(255,255,255,0.85); display: flex; flex-direction: column; gap: 28px; padding: 20px 16px; font-family: 'Noto Sans Arabic', system-ui, sans-serif; color: #12314D">

<div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 8px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: #12314D; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
</div>
<span style="font-family: 'Zain', 'Noto Sans Arabic', sans-serif; font-size: 22px; font-weight: 800; color: #0A1930">AI Mentor</span>
</div>

<nav aria-label="التنقل الرئيسي" style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="padding: 0 12px 6px; font-size: 12px; font-weight: 700; color: #667085">التعلّم</div>
<sc-for list="{{ learn }}" as="n" hint-placeholder-count="5">
<a href="#" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; {{n.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span style="flex-grow: 1">{{n.label}}</span>
<sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 13px; font-weight: 600; {{n.badgeStyle}}">{{n.badge}}</span>
</sc-if>
</a>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<div style="padding: 0 12px 6px; font-size: 12px; font-weight: 700; color: #667085">الحساب</div>
<sc-for list="{{ account }}" as="n" hint-placeholder-count="2">
<a href="#" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; {{n.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{n.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span style="flex-grow: 1">{{n.label}}</span>
</a>
</sc-for>
</div>
</nav>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid rgba(18,49,77,0.1); border-radius: 12px">
<div style="width: 38px; height: 38px; border-radius: 999px; background: #DEEAFB; color: #12314D; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0">م</div>
<div style="min-width: 0">
<div style="font-size: 14px; font-weight: 600; color: #0A1930">محمد</div>
<div style="font-size: 12px; color: #667085">الخطة المجانية</div>
</div>
</div>
<button type="button" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #12314D; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
<span>تسجيل الخروج</span>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","roadmap","tasks","resources","progress","profile","settings"],"default":"overview"},"$preview":{"width":264,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active || 'overview';
const mk = (id, label, icon, badge) => ({
label, icon,
badge: badge || '', hasBadge: !!badge,
cur: id === a ? 'page' : 'false',
style: id === a ? 'background: #12314D; color: #ffffff; font-weight: 600' : 'color: #12314D; font-weight: 500',
iconColor: id === a ? '#DEEAFB' : '#667085',
badgeStyle: id === a ? 'color: rgba(255,255,255,0.75)' : 'color: #667085'
});
return {
learn: [
mk('overview', 'نظرة عامة', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z'),
mk('roadmap', 'الخطة', 'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15'),
mk('tasks', 'المهام', 'M9 6h12M9 12h12M9 18h12M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2', '9'),
mk('resources', 'المصادر', 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM20 17v4H6.5'),
mk('progress', 'التقدّم', 'M3 3v18h18M7 15l4-4 3 3 6-6')
],
account: [
mk('profile', 'الملف الشخصي', 'M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z'),
mk('settings', 'الإعدادات', 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6')
]
};
}
}
</script>
</body>
</html>
